<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonnes Adresses Family Sync</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Segoe UI,sans-serif;max-width:1200px;margin:auto;padding:20px;background:#0f172a;color:#fff}.card{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0}input,select,textarea,button{padding:8px;margin:4px;border:none;border-radius:8px}button{background:#2563eb;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #475569}</style></head><body><h1>📍 Bonnes Adresses Family Sync</h1><div class='card'><select id='cat'><option>Restaurant</option><option>Hôtel</option><option>Activité</option><option>Bar</option><option>Lieu à visiter</option></select><input id='nom' placeholder='Nom'><input id='ville' placeholder='Ville'><input id='prix' placeholder='Prix'><textarea id='notes' placeholder='Notes'></textarea><button onclick='addItem()'>Ajouter</button></div><div class='card'><h2>🧪 À tester</h2><div id='todo'></div></div><div class='card'><h2>⭐ À garder</h2><div id='keep'></div></div><script src='app.js'></script></body></html>
