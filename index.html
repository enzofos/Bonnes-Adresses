<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes Bonnes Adresses V2</title><style>body{font-family:Segoe UI,sans-serif;background:#0f172a;color:#fff;max-width:1200px;margin:auto;padding:20px}.card{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0}input,select,button,textarea{padding:8px;margin:4px;border:none;border-radius:8px}button{background:#2563eb;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #475569}</style></head><body><h1>📍 Mes Bonnes Adresses & Idées V2</h1><div class='card'><h2>Ajouter une fiche</h2><select id='cat'><option>Restaurant</option><option>Hôtel</option><option>Activité</option><option>Bar</option><option>Lieu à visiter</option></select><input id='nom' placeholder='Nom'><input id='ville' placeholder='Ville'><input id='prix' placeholder='Prix estimé ou réel'><input id='dateTest' type='date'><input id='note5' type='number' min='0' max='5' placeholder='Note /5'><textarea id='notes' placeholder='Notes'></textarea><button onclick='ajouter()'>Ajouter</button></div><div class='card'><h2>🧪 À tester</h2><div id='atest'></div></div><div class='card'><h2>⭐ À garder</h2><div id='agarder'></div></div><script>let db=JSON.parse(localStorage.adressesV2||'{"todo":[],"keep":[]}');function save(){localStorage.adressesV2=JSON.stringify(db);render()}function ajouter(){db.todo.push({c:cat.value,n:nom.value,v:ville.value,p:prix.value,d:dateTest.value,s:note5.value,no:notes.value});save()}function aimer(i){db.keep.push(db.todo[i]);db.todo.splice(i,1);save()}function supprimer(i){db.todo.splice(i,1);save()}function edit(list,i){let arr=list==='todo'?db.todo:db.keep;let x=arr[i];x.n=prompt('Nom',x.n)||x.n;x.v=prompt('Ville',x.v)||x.v;x.p=prompt('Prix',x.p)||x.p;x.d=prompt('Date test',x.d)||x.d;x.s=prompt('Note /5',x.s)||x.s;x.no=prompt('Notes',x.no)||x.no;save()}function delKeep(i){db.keep.splice(i,1);save()}function render(){atest.innerHTML='<table><tr><th>Cat.</th><th>Nom</th><th>Ville</th><th>Prix</th><th>Actions</th></tr>'+db.todo.map((x,i)=>`<tr><td>${x.c}</td><td>${x.n}</td><td>${x.v}</td><td>${x.p}</td><td><button onclick="edit('todo',${i})">✏️</button><button onclick="aimer(${i})">✅</button><button onclick="supprimer(${i})">❌</button></td></tr>`).join('')+'</table>';agarder.innerHTML='<table><tr><th>Cat.</th><th>Nom</th><th>Ville</th><th>Prix</th><th>Date</th><th>Note</th><th>Notes</th><th>Actions</th></tr>'+db.keep.map((x,i)=>`<tr><td>${x.c}</td><td>${x.n}</td><td>${x.v}</td><td>${x.p}</td><td>${x.d||''}</td><td>${x.s||''}/5</td><td>${x.no||''}</td><td><button onclick="edit('keep',${i})">✏️</button><button onclick="delKeep(${i})">🗑️</button></td></tr>`).join('')+'</table>';}render();</script></body></html>
